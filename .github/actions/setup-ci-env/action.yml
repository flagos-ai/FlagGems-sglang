name: "Setup FlagGems-sglang CI environment"
description: >-
  Install Python, then layer FlagGems-sglang, sglang and triton_kernels on top
  of the runner's existing torch/Triton runtime.

inputs:
  python-version:
    description: "Python version for actions/setup-python"
    required: false
    default: "3.11"
  setup-python:
    description: >-
      Install Python with actions/setup-python (1) or use the interpreter
      already on PATH (0). Set to 0 on self-hosted accelerator runners, where
      a fresh interpreter would not have the vendor torch/Triton build that
      this environment layers on top of; pair it with virtual-env.
    required: false
    default: "1"
  virtual-env:
    description: >-
      Path to a preconfigured virtualenv to install into. When set, its bin/
      directory is prepended to PATH for the rest of the job.
    required: false
    default: ""
  sglang-version:
    description: "sglang version to install"
    required: false
    default: "0.5.19"
  triton-kernels-ref:
    description: "Triton git ref to install triton_kernels from"
    required: false
    default: "v3.6.0"
  install-sglang:
    description: "Install sglang (1) or skip it (0)"
    required: false
    default: "1"
  install-triton-kernels:
    description: "Install triton_kernels (1) or skip it (0)"
    required: false
    default: "1"
  require-project:
    description: >-
      Require `import flaggems_sglang` to succeed during verification. Set to
      0 on runners without a supported accelerator.
    required: false
    default: "1"
  collect-tests:
    description: "Run `pytest --collect-only` as a smoke check (1) or skip (0)"
    required: false
    default: "1"
  uv-version:
    description: "uv version to install when uv is not already on PATH"
    required: false
    default: "0.11.22"

runs:
  using: "composite"
  steps:
    - name: set up python
      if: ${{ inputs.setup-python == '1' }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip

    # A preconfigured venv on a self-hosted runner is what supplies the vendor
    # torch/Triton build, so it has to be on PATH before anything installs.
    - name: use preconfigured virtual environment
      if: ${{ inputs.virtual-env != '' }}
      shell: bash
      env:
        TARGET_VENV: ${{ inputs.virtual-env }}
      run: |
        set -euo pipefail
        if [ ! -x "${TARGET_VENV}/bin/python" ]; then
          echo "::error::no python at ${TARGET_VENV}/bin/python"
          exit 1
        fi
        echo "${TARGET_VENV}/bin" >>"${GITHUB_PATH}"
        echo "VIRTUAL_ENV=${TARGET_VENV}" >>"${GITHUB_ENV}"

    # Single script: installs uv, then layers the project, sglang and
    # triton_kernels on top of the runner's torch/Triton runtime.
    - name: prepare ci environment
      shell: bash
      env:
        UV_VERSION: ${{ inputs.uv-version }}
        SGLANG_VERSION: ${{ inputs.sglang-version }}
        TRITON_KERNELS_REF: ${{ inputs.triton-kernels-ref }}
        INSTALL_SGLANG: ${{ inputs.install-sglang }}
        INSTALL_TRITON_KERNELS: ${{ inputs.install-triton-kernels }}
        REQUIRE_PROJECT: ${{ inputs.require-project }}
        COLLECT_TESTS: ${{ inputs.collect-tests }}
      run: |
        bash "${GITHUB_WORKSPACE}/.github/scripts/prepare_ci_env.sh"
