name: basic ci

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  code-style:
    name: code style
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: check out repository
        uses: actions/checkout@v6

      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: install style tools
        shell: bash
        run: python -m pip install pre-commit pre-commit-hooks==4.6.0 black==24.8.0 flake8==7.1.0 isort==5.12.0

      - name: run pre-commit
        shell: bash
        run: pre-commit run --all-files --show-diff-on-failure

      # pre-commit covers Python only, and the CI scripts run on an
      # accelerator runner where a syntax error costs a whole job.
      - name: check ci scripts
        shell: bash
        run: |
          set -euo pipefail
          for script in .github/scripts/*.sh; do
            bash -n "${script}"
            test -x "${script}" || {
              echo "::error file=${script}::not executable; run chmod +x"
              exit 1
            }
          done
          # shellcheck ships with the GitHub ubuntu images; install it if a
          # future image drops it rather than skipping the check silently.
          command -v shellcheck >/dev/null || sudo apt-get install -y -qq shellcheck
          shellcheck .github/scripts/*.sh

  select-targets:
    name: select ci targets
    needs: code-style
    runs-on: h20
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      tests: ${{ steps.select.outputs.tests }}
      benchmarks: ${{ steps.select.outputs.benchmarks }}

    steps:
      - id: checkout-attempt-1
        name: check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
        continue-on-error: true

      - id: sleep-1
        if: steps.checkout-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-2
        name: retry checkout
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
        continue-on-error: true

      - id: sleep-2
        if: steps.checkout-attempt-2.outcome == 'failure'
        shell: bash
        run: sleep 30s

      - id: checkout-attempt-3
        name: retry checkout again
        if: steps.checkout-attempt-2.outcome == 'failure'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # tools/select_tests.py imports only argparse, shlex and pathlib, so
      # this job needs an interpreter rather than a prepared environment.
      - name: set up python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: collect ci selection inputs
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # The checkout is shallow, so the commit we diff against is not in
          # the clone. Fetch just that one commit: GitHub allows fetching by
          # full 40-character SHA, and --depth=1 keeps it to a single object.
          # If the fetch fails the diff would be meaningless, so fall back to
          # the current commit's own changes rather than selecting nothing.
          fetch_sha() {
            git cat-file -e "$1^{commit}" 2>/dev/null && return 0
            git fetch --depth=1 --no-tags origin "$1" 2>/dev/null
          }

          if [[ "${EVENT_NAME}" == "pull_request" ]] && fetch_sha "${PR_BASE_SHA}"; then
            git diff --name-only "${PR_BASE_SHA}" "${GITHUB_SHA}" > changed_files.txt
          elif [[ -n "${BEFORE_SHA}" && "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]] \
               && fetch_sha "${BEFORE_SHA}"; then
            git diff --name-only "${BEFORE_SHA}" "${GITHUB_SHA}" > changed_files.txt
          else
            git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}" > changed_files.txt
          fi

          echo "Changed files:"
          cat changed_files.txt

      - id: select
        name: select tests and benchmarks
        shell: bash
        run: |
          selection="$(python tools/select_tests.py \
            --changed-files changed_files.txt \
            --format shell)"
          eval "${selection}"

          echo "Test selection mode: ${TEST_SELECTION_MODE}"
          if [[ -n "${SELECTED_TESTS}" ]]; then
            echo "Selected tests: ${SELECTED_TESTS}"
          fi
          if [[ -n "${SELECTED_BENCHMARKS}" ]]; then
            echo "Selected benchmarks: ${SELECTED_BENCHMARKS}"
          fi

          echo "mode=${TEST_SELECTION_MODE}" >> "${GITHUB_OUTPUT}"
          echo "tests=${SELECTED_TESTS}" >> "${GITHUB_OUTPUT}"
          echo "benchmarks=${SELECTED_BENCHMARKS}" >> "${GITHUB_OUTPUT}"

  nvidia-tests:
    name: nvidia tests and benchmarks
    needs: select-targets
    if: needs.select-targets.outputs.tests != '' || needs.select-targets.outputs.benchmarks != ''
    runs-on: h20
    timeout-minutes: 30
    env:
      DNN_VENDOR: nvidia
      PYTHONPATH: ${{ github.workspace }}/src
    permissions:
      contents: write
      pull-requests: write
      statuses: write

    steps:
      - name: check out repository
        uses: actions/checkout@v6

      - name: show gpu
        shell: bash
        run: nvidia-smi

      - name: add cuda to path
        shell: bash
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"

      # setup-ci-env creates and populates the environment itself, so no
      # preconfigured venv on the runner is involved.
      - name: prepare ci environment
        uses: ./.github/actions/setup-ci-env
        with:
          # setup-python is off on purpose: the vendor torch and Triton build
          # that this environment layers on top of belongs to the base image's
          # interpreter, and the venv inherits it from there. A freshly
          # installed interpreter would not see it.
          setup-python: "0"
          # The job runs the real suite right after, so the collection smoke
          # check would only repeat work.
          collect-tests: "0"

      - name: run selected unit tests
        if: needs.select-targets.outputs.tests != ''
        shell: bash
        env:
          SELECTED_TESTS: ${{ needs.select-targets.outputs.tests }}
        run: |
          echo "Selected tests: ${SELECTED_TESTS}"
          pytest -q ${SELECTED_TESTS} --quick

      - name: run selected benchmarks
        if: needs.select-targets.outputs.benchmarks != ''
        shell: bash
        env:
          SELECTED_BENCHMARKS: ${{ needs.select-targets.outputs.benchmarks }}
        run: |
          # 1. 创建 Markdown 头部信息
          echo "### ⏱️ Core Benchmark Results" > bench_result.md
          echo "Executed: \`pytest -q ${SELECTED_BENCHMARKS} --level core\`" >> bench_result.md
          echo "" >> bench_result.md
          echo '```text' >> bench_result.md
          # 2. 运行你的标准命令，并将输出追加到 md 文件中
          # || true 确保即使性能测试未达标（报错），CI 也能正常把结果贴出来
          pytest -q ${SELECTED_BENCHMARKS} --level core >> bench_result.md 2>&1 || true
          # 3. 闭合代码块
          echo '```' >> bench_result.md
