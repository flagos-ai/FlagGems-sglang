name: Sync master to kernelgen-dev

on:
  schedule:
    # Daily at 04:00 Asia/Shanghai (20:00 UTC on the preceding day).
    - cron: '0 20 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read-only check without creating or updating a PR'
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-master-to-kernelgen-dev
  cancel-in-progress: false

jobs:
  sync:
    # Scheduled runs use the default branch. Avoid enabling the inherited
    # schedule automatically in forks or via dispatch from another branch.
    if: github.repository == 'flagos-ai/FlagGems-sglang' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Create or update manual-merge sync PR
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then
            python tools/sync_kernelgen_dev.py --dry-run
          else
            python tools/sync_kernelgen_dev.py
          fi
