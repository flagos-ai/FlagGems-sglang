ops:
  - id: add3
    description: |
      Three-way elementwise addition that preserves the double rounding: bf16(bf16(a + b) + c).
      Accumulating in fp32 and rounding once is not allowed; the result stays bit-identical to the unfused form.
    for:
      - add3
    labels:
      - fused
      - pointwise
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: apply_token_bitmask
    description: |
      Applies a packed bitmask to logits for grammar-constrained decoding.
      Masks out disallowed vocabulary tokens by setting them to -inf.
    for:
      - apply_token_bitmask
    labels:
      - fused
      - sglang
      - Sampling
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: bmm_chunk
    description: |
      Chunked batched matrix multiplication for the Mamba2 SSD scan.
      Computes per-chunk C @ B^T products with optional causal masking.
    for:
      - bmm_chunk
    labels:
      - fused
      - sglang
      - Mamba
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: build_trtllm_mha_page_table
    description: |
      Builds the TRT-LLM MHA page table on device with no host sync.
      Reads the KV token slot at each page boundary and stores slot // page_size as the block id.
    for:
      - build_trtllm_mha_page_table
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: causal_conv1d_fn
    description: |
      Generic depthwise causal 1-D convolution over continuous-batched sequences.
      Computes depthwise causal convolution with optional bias and SiLU activation.
    for:
      - causal_conv1d_fn
    labels:
      - fused
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: chunk_cumsum
    description: |
      Chunk-wise cumulative sum of the Mamba timestep and state-decay terms.
      Computes dt with optional softplus and bias, plus the cumulative dA per chunk.
    for:
      - chunk_cumsum
    labels:
      - fused
      - sglang
      - Mamba
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: chunk_local_cumsum_scalar
    description: |
      Computes local cumulative sum over chunked sequences with optional scaling and reverse direction.
      Supports both direct and transposed cumsum computation.
    for:
      - chunk_local_cumsum_scalar
    labels:
      - fused
      - sglang
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: chunk_local_cumsum_vector
    description: |
      Within-chunk cumulative sum of a per-token, per-head vector gate.
      Supports optional scaling and reverse-direction accumulation.
    for:
      - chunk_local_cumsum_vector
    labels:
      - fused
      - sglang
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: chunk_state
    description: |
      Mamba2 per-chunk SSM hidden-state accumulation.
      Accumulates x against the decay- and dt-scaled state-projection matrix per chunk.
    for:
      - chunk_state
    labels:
      - fused
      - sglang
      - Mamba
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: chunk_state_varlen
    description: |
      Variable-length variant of the Mamba2 per-chunk state accumulation.
      Handles packed sequences delimited by cumulative sequence lengths.
    for:
      - chunk_state_varlen
    labels:
      - fused
      - sglang
      - Mamba
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: clamp_position
    description: |
      Decode-step position computation: positions = clamp(seq_lens - 1, min=0).
      Arithmetically trivial but launched once per forward on the critical path, so it is latency bound.
    for:
      - clamp_position
    labels:
      - fused
      - pointwise
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: compute_position
    description: |
      Fused position and start-offset computation for extend (chunked-prefill) batches.
      Runs the exclusive prefix sum of the extend lengths in-kernel and fills prefix_len + arange(extend_len).
    for:
      - compute_position
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: compute_src2dst
    description: |
      Inverts the Mixture-of-Experts routing permutation.
      Scatters the destination slot of every source (token, slot) pair from the sorted reorder ids.
    for:
      - compute_src2dst
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: concat_and_cast_mha_k
    description: |
      Builds the MHA key tensor from the per-head NoPE part and the broadcast single-head RoPE part.
      Casts implicitly on store, so a lower-precision KV cache target needs no extra pass.
    for:
      - concat_and_cast_mha_k
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: concat_mla_k
    description: |
      Builds the MLA key tensor from its NoPE and RoPE halves.
      Copies the per-head NoPE part and broadcasts the single-head RoPE part across all heads.
    for:
      - concat_mla_k
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: context_attention
    description: |
      Prefill/context-stage scaled dot-product attention on packed variable-length sequences.
      Supports causal masking over sequences delimited by per-batch start offsets and lengths.
    for:
      - context_attention
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: create_flashinfer_kv_indices
    description: |
      Flattens the per-request token slots of the req_to_token pool into a ragged kv_indices buffer.
      Produces the layout FlashInfer paged attention consumes, using per-request prefix offsets.
    for:
      - create_flashinfer_kv_indices
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: create_flashmla_kv_indices
    description: |
      Builds the FlashMLA block table with one entry per page instead of one per token.
      Reads the token slot at each page boundary and divides it by the page size.
    for:
      - create_flashmla_kv_indices
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: decode_attention
    description: |
      Decode-stage attention against a paged KV cache.
      Gathers keys and values through an indirection table for single-token queries.
    for:
      - decode_attention
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: decode_grouped_attention
    description: |
      Grouped-query variant of decode-stage paged attention.
      Shares each KV head across a group of query heads to cut cache bandwidth.
    for:
      - decode_grouped_attention
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: deepep_permute
    description: |
      DeepEP MoE gather prologue that permutes token rows into the grouped-GEMM input.
      Replicates each token's hidden row once per routed slot and skips dropped slots.
    for:
      - deepep_permute
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: deepep_post_reorder
    description: |
      DeepEP MoE epilogue that gathers each token's top-k expert outputs out of the permuted layout.
      Combines them with the routing weights and the routed scaling factor.
    for:
      - deepep_post_reorder
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: draft_topk1
    description: |
      Top-1 draft token selection for speculative decoding.
      Picks the argmax draft token per position and writes it to the draft token column.
    for:
      - draft_topk1
    labels:
      - fused
      - sglang
      - Speculative
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: dsv3_fused_a_gemm
    description: |
      DeepSeek-V3 fused QKV-A down-projection GEMM at decode shapes (num_tokens <= 16).
      Hand-tuned skinny-M matmul for the heaviest weight read in attention preprocessing.
    for:
      - dsv3_fused_a_gemm
    labels:
      - fused
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: embedding_lora_a
    description: |
      LoRA A-projection over an embedding lookup for segmented multi-adapter batches.
      Selects the per-segment adapter weight and projects the gathered rows.
    for:
      - embedding_lora_a
    labels:
      - fused
      - sglang
      - LoRA
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fill_padded_rows
    description: |
      Fills every padding row of a routed MoE activation with a constant value.
      Reads the non-padded row count from device memory so the static grid stays CUDA-graph capturable.
    for:
      - fill_padded_rows
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fixup_zero_kv
    description: |
      Post-processing for TRT-LLM ragged attention requests whose KV length is zero.
      Zeroes their output rows and sets the log-sum-exp to -inf in one launch, with no host sync.
    for:
      - fixup_zero_kv
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_eh_norm
    description: |
      EAGLE draft-model preprocessing: RMSNorm of the input embeddings and the previous hidden state.
      Uses separate weights per half and concatenates them, replacing two norms plus a cat.
    for:
      - fused_eh_norm
    labels:
      - fused
      - sglang
      - Normalization
      - Speculative
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_gate_sigmoid_mul_add
    description: |
      Gating fusion for Mixture-of-Experts shared experts.
      Reduces the hidden/gate row dot product, then adds sigmoid(gate) * shared_output onto the accumulator.
    for:
      - fused_gate_sigmoid_mul_add
    labels:
      - fused
      - sglang
      - Activation
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_moe_dispatch_index
    description: |
      Builds the permuted grouped-GEMM destination indices for masked/DeepGEMM MoE in a single launch.
      Buckets each (token, slot) pair by expert with an atomic cursor and turns the offsets into flat rows.
    for:
      - fused_moe_dispatch_index
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_moe_gemm
    description: |
      Fused Mixture-of-Experts GEMM operation that combines token routing and expert computation.
      Performs weighted expert-specific matrix multiplication for MoE models.
    for:
      - fused_moe_gemm
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_moe_router_cudacore
    description: |
      Fused Mixture-of-Experts router evaluated on CUDA cores.
      Computes router logits with optional softcapping and correction bias, then selects top-k experts.
    for:
      - fused_moe_router_cudacore
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_moe_router_tensorcore
    description: |
      Tensor Core variant of the fused Mixture-of-Experts router.
      Mathematically identical to the CUDA-core router, tuned for Tensor Core throughput.
    for:
      - fused_moe_router_tensorcore
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_rmsnorm
    description: |
      Fused root-mean-square layer normalization with a learned weight.
      Computes the reciprocal RMS and applies the scale in a single pass.
    for:
      - fused_rmsnorm
    labels:
      - fused
      - sglang
      - Normalization
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: gate_topk
    description: |
      Streaming top-k for small k (k <= 32), a drop-in replacement for torch.topk along the last dim.
      Packs (value, index) into one sortable key so the whole top-k state stays in registers.
    for:
      - gate_topk
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: gate_up_lora_b
    description: |
      LoRA B-projection for fused gate/up projections in segmented multi-adapter batches.
      Expands the low-rank activations and accumulates onto the base output.
    for:
      - gate_up_lora_b
    labels:
      - fused
      - sglang
      - LoRA
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: gelu_and_mul
    description: |
      Fused GELU gate and multiply operation. Computes gelu(x[..., :d]) * x[..., d:] in a single pass.
      Stride-aware so non-contiguous gate/up splits are handled without a copy.
    for:
      - gelu_and_mul
    labels:
      - fused
      - pointwise
      - sglang
      - Activation
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: gelu_tanh_and_mul
    description: |
      Gated GELU with the tanh approximation: gelu_tanh(x[..., :d]) * x[..., d:].
      The gelu_pytorch_tanh variant, distinct from the exact erf-based gelu_and_mul.
    for:
      - gelu_tanh_and_mul
    labels:
      - fused
      - pointwise
      - sglang
      - Activation
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: group_norm_silu
    description: |
      Fused GroupNorm plus SiLU for diffusion U-Net and VAE blocks.
      Computes the group statistics and the affine transform in fp32 before activating.
    for:
      - group_norm_silu
    labels:
      - fused
      - sglang
      - Normalization
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: hash_topk
    description: |
      Hash-routed Mixture-of-Experts gate whose expert set is looked up by token id, so there is no top-k search.
      Gathers the routed logits, scores with sqrt(softplus(.)), renormalizes rows and appends fused shared experts.
    for:
      - hash_topk
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: indexed_scale_shift
    description: |
      Per-row AdaLN modulation with the scale and shift tables gathered through an index vector.
      Two explicit bf16 roundings reproduce the eager kernel boundaries as part of the contract.
    for:
      - indexed_scale_shift
    labels:
      - fused
      - pointwise
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: interleaved_rope
    description: |
      Interleaved-layout Rotary Positional Embedding.
      Rotates adjacent element pairs using multi-section temporal, height, and width splits.
    for:
      - interleaved_rope
    labels:
      - fused
      - sglang
      - RoPE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: mamba_layernorm_gated
    description: |
      Gated layer/RMS normalization for Mamba blocks.
      Applies grouped normalization with a SiLU gate before or after the norm.
    for:
      - mamba_layernorm_gated
    labels:
      - fused
      - sglang
      - Mamba
      - Normalization
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: merge_state
    description: |
      Merges attention states from prefix and suffix sequences using log-sum-exp scaling.
      Used for continuous batching and chunked attention computation.
    for:
      - merge_state
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: moe_align_block_size
    description: |
      The MoE sort and pad that every block-tiled fused-MoE GEMM depends on.
      Groups the flattened (token, slot) pairs by expert and pads each expert run to a multiple of block_size.
    for:
      - moe_align_block_size
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: moe_align_single_token
    description: |
      Single-token decode specialization of moe_align_block_size.
      One token with distinct experts, so each expert owns one block and a single warp does all the work.
    for:
      - moe_align_single_token
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: moe_fused_gate
    description: |
      Fused Mixture-of-Experts gating with expert-group selection.
      Scores experts, applies bias and top-k selection, then optionally renormalizes and rescales.
    for:
      - moe_fused_gate
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: moe_fused_mul_sum
    description: |
      Fused weighted reduction of Mixture-of-Experts outputs.
      Scales each top-k expert output by its routing weight and sums over top-k,
      masking slots dropped by expert-parallel routing.
    for:
      - moe_fused_mul_sum
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: moe_sum_reduce
    description: |
      Sums the per-expert outputs of a Mixture-of-Experts layer.
      Reduces over the top-k dimension and applies the routed scaling factor.
    for:
      - moe_sum_reduce
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: moe_topk_sum
    description: |
      Reduces each token's per-expert Mixture-of-Experts outputs over the top-k dimension.
      Pure bandwidth: top-k reads and one write per output element, accumulated in fp32.
    for:
      - moe_topk_sum
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: mrope_fused
    description: |
      Multi-dimensional Rotary Positional Embedding (mRoPE) for query and key tensors.
      Applies position-dependent rotation across temporal, height, and width dimensions.
    for:
      - mrope_fused
    labels:
      - fused
      - sglang
      - RoPE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: pack_topk_ids
    description: |
      Packs each (expert id, routing weight) pair into a single int32.
      The low 16 bits carry the weight's bf16 bit pattern, the layout the FlashInfer TRT-LLM MoE path consumes.
    for:
      - pack_topk_ids
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: per_group_transpose
    description: |
      Per-expert group transpose operation for MoE models.
      Transposes tensor blocks grouped by expert assignment for efficient computation.
    for:
      - per_group_transpose
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: per_token_group_quant_int8
    description: |
      Per-token, per-group symmetric INT8 quantization.
      Emits quantized values alongside one scale per token group.
    for:
      - per_token_group_quant_int8
    labels:
      - fused
      - sglang
      - Quantization
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: per_token_quant_int8
    description: |
      Per-token symmetric INT8 quantization.
      Emits quantized values alongside one scale per token row.
    for:
      - per_token_quant_int8
    labels:
      - fused
      - sglang
      - Quantization
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: post_reorder_cutlass
    description: |
      CUTLASS-MoE epilogue that combines each token's routed expert outputs in fp32.
      Skips slots routed off the local expert-parallel rank and folds the routed scaling factor into the store.
    for:
      - post_reorder_cutlass
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: qkv_lora_b
    description: |
      LoRA B-projection for fused QKV projections in segmented multi-adapter batches.
      Expands the low-rank activations into per-slice Q, K and V offsets of the base output.
    for:
      - qkv_lora_b
    labels:
      - fused
      - sglang
      - LoRA
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: relu2
    description: |
      Squared ReLU, elementwise: max(0, x) ** 2, computed in fp32 and cast back.
      Ungated, so unlike the *_and_mul activations the output keeps the input shape.
    for:
      - relu2
    labels:
      - fused
      - pointwise
      - sglang
      - Activation
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: residual_gate_add
    description: |
      Elementwise residual/gate update of an LTX-2 transformer block: residual + T(update * gate).
      Rounds the intermediate product to the tensor dtype so the double rounding matches the unfused sequence.
    for:
      - residual_gate_add
    labels:
      - fused
      - pointwise
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: rotary_embedding
    description: |
      Rotary Positional Embedding with precomputed cosine and sine tables.
      Supports both the interleaved and half-split rotation layouts.
    for:
      - rotary_embedding
    labels:
      - fused
      - sglang
      - RoPE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: selective_state_update
    description: |
      Single-step Mamba selective state-space update.
      Advances the recurrent state in float32 with optional softplus dt, D skip and gating.
    for:
      - selective_state_update
    labels:
      - fused
      - sglang
      - Mamba
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: seqlens_expand
    description: |
      Expands the per-request (qo_len, kv_len) pairs of an extend batch into per-query-token KV lengths.
      Clamps at zero so DP-padded idle rows cannot turn into huge unsigned lengths downstream.
    for:
      - seqlens_expand
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: sgemm_lora_a
    description: |
      LoRA A-projection GEMM for segmented multi-adapter batches.
