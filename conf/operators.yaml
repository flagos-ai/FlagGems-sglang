ops:
  - id: add3
    description: |
      Three-way elementwise addition that preserves the double rounding: bf16(bf16(a + b) + c).
      Accumulating in fp32 and rounding once is not allowed; the result stays bit-identical to the unfused form.
    for:
      - add3
    labels:
      - fused
      - pointwise
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: add_constant
    description: |
      Elementwise addition of a compile-time integer constant: dst = src + constant.
      The constant is folded into the kernel body, so every distinct value triggers its own JIT compilation.
    for:
      - add_constant
    labels:
      - fused
      - pointwise
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: apply_token_bitmask
    description: |
      Applies a packed bitmask to logits for grammar-constrained decoding.
      Masks out disallowed vocabulary tokens by setting them to -inf.
    for:
      - apply_token_bitmask
    labels:
      - fused
      - sglang
      - Sampling
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: assign_draft_cache_locs_contiguous
    description: |
      Copies each request's newly allocated draft KV slots out of the req_to_token pool.
      The slots are packed into the flat out_cache_loc buffer consumed by the draft forward pass.
    for:
      - assign_draft_cache_locs_contiguous
    labels:
      - fused
      - sglang
      - Speculative
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: bmm_chunk
    description: |
      Chunked batched matrix multiplication for the Mamba2 SSD scan.
      Computes per-chunk C @ B^T products with optional causal masking.
    for:
      - bmm_chunk
    labels:
      - fused
      - sglang
      - Mamba
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: build_trtllm_mha_page_table
    description: |
      Builds the TRT-LLM MHA page table on device with no host sync.
      Reads the KV token slot at each page boundary and stores slot // page_size as the block id.
    for:
      - build_trtllm_mha_page_table
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: causal_conv1d_fn
    description: |
      Generic depthwise causal 1-D convolution over continuous-batched sequences.
      Computes depthwise causal convolution with optional bias and SiLU activation.
    for:
      - causal_conv1d_fn
    labels:
      - fused
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: causal_conv1d_update
    description: |
      Single-step depthwise causal 1-D convolution update against a rolling conv state.
      Shifts the cached state, convolves with the kernel and optional bias, then applies SiLU.
    for:
      - causal_conv1d_update
    labels:
      - fused
      - sglang
      - Mamba
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: chain_speculative_sampling
    description: |
      Chain speculative sampling for tree-based speculative decoding.
      Accepts or rejects each draft token per request and samples a final token from the adjusted target distribution.
    for:
      - chain_speculative_sampling
    labels:
      - fused
      - sglang
      - Speculative
      - Sampling
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: chunk_cumsum
    description: |
      Chunk-wise cumulative sum of the Mamba timestep and state-decay terms.
      Computes dt with optional softplus and bias, plus the cumulative dA per chunk.
    for:
      - chunk_cumsum
    labels:
      - fused
      - sglang
      - Mamba
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: chunk_local_cumsum_scalar
    description: |
      Computes local cumulative sum over chunked sequences with optional scaling and reverse direction.
      Supports both direct and transposed cumsum computation.
    for:
      - chunk_local_cumsum_scalar
    labels:
      - fused
      - sglang
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: chunk_local_cumsum_vector
    description: |
      Within-chunk cumulative sum of a per-token, per-head vector gate.
      Supports optional scaling and reverse-direction accumulation.
    for:
      - chunk_local_cumsum_vector
    labels:
      - fused
      - sglang
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: chunk_scaled_dot_kkt
    description: |
      Per-chunk lower-triangular K K^T attention matrix for gated delta-rule linear attention.
      Scales by beta and the gate-cumsum decay, with grouped-query head broadcasting.
    for:
      - chunk_scaled_dot_kkt
    labels:
      - fused
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: chunk_state
    description: |
      Mamba2 per-chunk SSM hidden-state accumulation.
      Accumulates x against the decay- and dt-scaled state-projection matrix per chunk.
    for:
      - chunk_state
    labels:
      - fused
      - sglang
      - Mamba
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: chunk_state_varlen
    description: |
      Variable-length variant of the Mamba2 per-chunk state accumulation.
      Handles packed sequences delimited by cumulative sequence lengths.
    for:
      - chunk_state_varlen
    labels:
      - fused
      - sglang
      - Mamba
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: chunked_embedding_lora_a
    description: |
      LoRA A-projection over an embedding lookup for chunked segmented multi-adapter batches.
      Gathers each segment's rows through a permutation and projects them with the per-segment adapter.
    for:
      - chunked_embedding_lora_a
    labels:
      - fused
      - sglang
      - LoRA
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: chunked_sgmv_expand
    description: |
      Segmented GEMV LoRA B-projection expand for chunked multi-adapter batches.
      Expands the low-rank activations per slice and accumulates onto the base output with per-adapter scaling.
    for:
      - chunked_sgmv_expand
    labels:
      - fused
      - sglang
      - LoRA
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: chunked_sgmv_shrink
    description: |
      Segmented GEMV LoRA A-projection shrink for chunked multi-adapter batches.
      Shrinks activations to the adapter rank per segment, optionally over a stack of slices.
    for:
      - chunked_sgmv_shrink
    labels:
      - fused
      - sglang
      - LoRA
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: clamp_position
    description: |
      Decode-step position computation: positions = clamp(seq_lens - 1, min=0).
      Arithmetically trivial but launched once per forward on the critical path, so it is latency bound.
    for:
      - clamp_position
    labels:
      - fused
      - pointwise
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: compute_position
    description: |
      Fused position and start-offset computation for extend (chunked-prefill) batches.
      Runs the exclusive prefix sum of the extend lengths in-kernel and fills prefix_len + arange(extend_len).
    for:
      - compute_position
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: compute_src2dst
    description: |
      Inverts the Mixture-of-Experts routing permutation.
      Scatters the destination slot of every source (token, slot) pair from the sorted reorder ids.
    for:
      - compute_src2dst
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: concat_and_cast_mha_k
    description: |
      Builds the MHA key tensor from the per-head NoPE part and the broadcast single-head RoPE part.
      Casts implicitly on store, so a lower-precision KV cache target needs no extra pass.
    for:
      - concat_and_cast_mha_k
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: concat_mla_absorb_q
    description: |
      Concatenates the NoPE and RoPE halves of the absorbed MLA query along the last dimension.
      Two source rows with different strides feed one contiguous destination row, at MLA head counts.
    for:
      - concat_mla_absorb_q
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: concat_mla_k
    description: |
      Builds the MLA key tensor from its NoPE and RoPE halves.
      Copies the per-head NoPE part and broadcasts the single-head RoPE part across all heads.
    for:
      - concat_mla_k
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: context_attention
    description: |
      Prefill/context-stage scaled dot-product attention on packed variable-length sequences.
      Supports causal masking over sequences delimited by per-batch start offsets and lengths.
    for:
      - context_attention
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: conv_window_scatter_with_mask
    description: |
      Conv-window variant of state_scatter_with_mask for speculative decoding mamba commits.
      The source is an overlapping as_strided view, so the kernel indexes (dim, win) elements through its strides.
    for:
      - conv_window_scatter_with_mask
    labels:
      - fused
      - sglang
      - Mamba
      - Speculative
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: create_chunked_prefix_cache_kv_indices
    description: |
      Chunked-prefill variant of create_flashinfer_kv_indices.
      Each request contributes only the [chunk_start_idx, chunk_start_idx + chunk_seq_len) window of its pool.
    for:
      - create_chunked_prefix_cache_kv_indices
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: create_flashinfer_kv_indices
    description: |
      Flattens the per-request token slots of the req_to_token pool into a ragged kv_indices buffer.
      Produces the layout FlashInfer paged attention consumes, using per-request prefix offsets.
    for:
      - create_flashinfer_kv_indices
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: create_flashmla_kv_indices
    description: |
      Builds the FlashMLA block table with one entry per page instead of one per token.
      Reads the token slot at each page boundary and divides it by the page size.
    for:
      - create_flashmla_kv_indices
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: dcp_lse_combine
    description: |
      Combines the partial attention outputs of N decode-context-parallel ranks using their log-sum-exp values.
      NaN and +inf lse entries are sanitized to -inf so a dead shard contributes nothing.
    for:
      - dcp_lse_combine
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: decode_attention
    description: |
      Decode-stage attention against a paged KV cache.
      Gathers keys and values through an indirection table for single-token queries.
    for:
      - decode_attention
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: decode_grouped_attention
    description: |
      Grouped-query variant of decode-stage paged attention.
      Shares each KV head across a group of query heads to cut cache bandwidth.
    for:
      - decode_grouped_attention
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: deepep_permute
    description: |
      DeepEP MoE gather prologue that permutes token rows into the grouped-GEMM input.
      Replicates each token's hidden row once per routed slot and skips dropped slots.
    for:
      - deepep_permute
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: deepep_post_reorder
    description: |
      DeepEP MoE epilogue that gathers each token's top-k expert outputs out of the permuted layout.
      Combines them with the routing weights and the routed scaling factor.
    for:
      - deepep_post_reorder
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: draft_topk1
    description: |
      Top-1 draft token selection for speculative decoding.
      Picks the argmax draft token per position and writes it to the draft token column.
    for:
      - draft_topk1
    labels:
      - fused
      - sglang
      - Speculative
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: dsv3_fused_a_gemm
    description: |
      DeepSeek-V3 fused QKV-A down-projection GEMM at decode shapes (num_tokens <= 16).
      Hand-tuned skinny-M matmul for the heaviest weight read in attention preprocessing.
    for:
      - dsv3_fused_a_gemm
    labels:
      - fused
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: embedding_lora_a
    description: |
      LoRA A-projection over an embedding lookup for segmented multi-adapter batches.
      Selects the per-segment adapter weight and projects the gathered rows.
    for:
      - embedding_lora_a
    labels:
      - fused
      - sglang
      - LoRA
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: ernie45_rope_fused
    description: |
      Fused multi-section Rotary Positional Embedding for the ERNIE 4.5 query and key layout.
      Rotates the half-split rotary dimensions with per-section temporal, height and width offsets.
    for:
      - ernie45_rope_fused
    labels:
      - fused
      - sglang
      - RoPE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: extend_attention
    description: |
      Prefill/extend-stage attention that mixes freshly extended keys and values with the paged KV cache.
      Operates on packed variable-length sequences delimited by query and KV index pointers, with grouped-query heads.
    for:
      - extend_attention
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fill_accept_out_cache_loc
    description: |
      Compacts the KV cache slots of the accepted draft tokens in speculative decoding.
      accept_index gives each accepted slot's draft-token position, -1 marks a rejection, survivors are packed.
    for:
      - fill_accept_out_cache_loc
    labels:
      - fused
      - sglang
      - Speculative
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fill_bonus_tokens
    description: |
      Picks each request's bonus token out of the accepted-token matrix in speculative decoding.
      bonus_tokens[i] = accept_tokens[i, accept_lens[i] - 1], since accept_lens counts the bonus token too.
    for:
      - fill_bonus_tokens
    labels:
      - fused
      - sglang
      - Speculative
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fill_padded_rows
    description: |
      Fills every padding row of a routed MoE activation with a constant value.
      Reads the non-padded row count from device memory so the static grid stays CUDA-graph capturable.
    for:
      - fill_padded_rows
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fixup_zero_kv
    description: |
      Post-processing for TRT-LLM ragged attention requests whose KV length is zero.
      Zeroes their output rows and sets the log-sum-exp to -inf in one launch, with no host sync.
    for:
      - fixup_zero_kv
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fla_layernorm_gated
    description: |
      Gated layer/RMS normalization for linear-attention (FLA) blocks.
      Normalizes with an optional mean subtraction and applies a SiLU/Swish gate before the affine scale.
    for:
      - fla_layernorm_gated
    labels:
      - fused
      - sglang
      - Normalization
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_dual_residual_rmsnorm
    description: |
      Two chained RMS norms with a residual add in between.
      Normalizes x with weight1, adds the residual, then normalizes the sum with weight2; returns the output and the intermediate residual.
    for:
      - fused_dual_residual_rmsnorm
    labels:
      - fused
      - sglang
      - Normalization
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_eh_norm
    description: |
      EAGLE draft-model preprocessing: RMSNorm of the input embeddings and the previous hidden state.
      Uses separate weights per half and concatenates them, replacing two norms plus a cat.
    for:
      - fused_eh_norm
    labels:
      - fused
      - sglang
      - Normalization
      - Speculative
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_gate_sigmoid_mul_add
    description: |
      Gating fusion for Mixture-of-Experts shared experts.
      Reduces the hidden/gate row dot product, then adds sigmoid(gate) * shared_output onto the accumulator.
    for:
      - fused_gate_sigmoid_mul_add
    labels:
      - fused
      - sglang
      - Activation
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_gdn_gating
    description: |
      Fused gated delta-net gating for linear attention.
      Computes the log-space decay g = -exp(A_log) * softplus(a + dt_bias) and the sigmoid beta gate in one pass.
    for:
      - fused_gdn_gating
    labels:
      - fused
      - sglang
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_moe_dispatch_index
    description: |
      Builds the permuted grouped-GEMM destination indices for masked/DeepGEMM MoE in a single launch.
      Buckets each (token, slot) pair by expert with an atomic cursor and turns the offsets into flat rows.
    for:
      - fused_moe_dispatch_index
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_moe_gemm
    description: |
      Fused Mixture-of-Experts GEMM operation that combines token routing and expert computation.
      Performs weighted expert-specific matrix multiplication for MoE models.
    for:
      - fused_moe_gemm
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_moe_router_cudacore
    description: |
      Fused Mixture-of-Experts router evaluated on CUDA cores.
      Computes router logits with optional softcapping and correction bias, then selects top-k experts.
    for:
      - fused_moe_router_cudacore
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_moe_router_tensorcore
    description: |
      Tensor Core variant of the fused Mixture-of-Experts router.
      Mathematically identical to the CUDA-core router, tuned for Tensor Core throughput.
    for:
      - fused_moe_router_tensorcore
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_norm_rope_stacked
    description: |
      Fused per-layer K RMS norm and Rotary Positional Embedding over a stacked KV tensor.
      Normalizes each layer's key heads and rotates the half-split rotary dimensions in a single pass.
    for:
      - fused_norm_rope_stacked
    labels:
      - fused
      - sglang
      - Normalization
      - RoPE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_pack_qkv
    description: |
      Packs padded [B, S, H, D] Q/K/V into varlen [total_valid, H, D] through a shared gather index.
      One launch gathers all three tensors instead of three independent advanced-index gathers.
    for:
      - fused_pack_qkv
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_qkvzba_split_reshape_cat
    description: |
      Splits the packed GDN projection into the four tensors the linear-attention kernel needs, in a single launch.
      Pure layout movement with no arithmetic, so it is bandwidth bound and the problem is address computation.
    for:
      - fused_qkvzba_split_reshape_cat
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_rmsnorm
    description: |
      Fused root-mean-square layer normalization with a learned weight.
      Computes the reciprocal RMS and applies the scale in a single pass.
    for:
      - fused_rmsnorm
    labels:
      - fused
      - sglang
      - Normalization
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_sigmoid_mul
    description: |
      Attention output gating: out = attn_output * sigmoid(gate).
      The strided path reads a 3D gate through its strides against a 2D attn_output, with no contiguous copy.
    for:
      - fused_sigmoid_mul
    labels:
      - fused
      - pointwise
      - sglang
      - Activation
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: fused_softmax_pool
    description: |
      Softmax-weighted pooling along the K axis with the values and scores packed in one tensor.
      The softmax is per channel along K, so one pass replaces softmax plus elementwise multiply plus reduction.
    for:
      - fused_softmax_pool
    labels:
      - fused
      - sglang
      - Attention
    kind:
      - Reduction
    stages:
      - stable: '1.0'
  - id: gate_topk
    description: |
      Streaming top-k for small k (k <= 32), a drop-in replacement for torch.topk along the last dim.
      Packs (value, index) into one sortable key so the whole top-k state stays in registers.
    for:
      - gate_topk
    labels:
      - fused
      - sglang
      - MoE
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: gate_up_lora_b
    description: |
      LoRA B-projection for fused gate/up projections in segmented multi-adapter batches.
      Expands the low-rank activations and accumulates onto the base output.
    for:
      - gate_up_lora_b
    labels:
      - fused
      - sglang
      - LoRA
    kind:
      - NeuralNetwork
    stages:
      - stable: '1.0'
  - id: gather_spec_extras
    description: |
      Gathers four speculative-decoding side buffers with a shared row index in one fused launch.
      Covers topk_p, topk_index, bonus_tokens and an optional hidden_states, removing three launch bubbles.
    for:
      - gather_spec_extras
    labels:
      - fused
      - sglang
      - Speculative
    kind:
      - NeuralNetwork
    stages:
