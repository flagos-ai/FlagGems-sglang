[build-system]
requires = ["setuptools", "scikit-build-core", "pybind11"]
build-backend = "setuptools.build_meta"


[project]
name = "flaggems_sglang"
version = "0.1.0"
description = "FlagGems-sglang is a deep neural network function library written in Triton."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.8.0"
license = { text = "Apache Software License" }
authors = [
    { name = "Hongyu Liu", email = "liuhyscc@gmail.com" },
    { name = "flagos", email = "contact@flagos.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch",
    "packaging",
    "pybind11",
    "PyYAML",
    "sqlalchemy",
]

[project.optional-dependencies]
test = [
    "pytest",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/flagos-ai/FlagGems-sglang"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flaggems_sglang.runtime" = ["*/**/*.yaml"]
"flaggems_sglang_backport" = ["patches/*.patch"]

[tool.scikit-build]
build.verbose = true
logging.level = "INFO"
wheel.install-dir = "flaggems_sglang"
build-dir = "build/{cache_tag}"

[tool.black]
line-length = 79

[tool.flake8]
max-line-length = 79
