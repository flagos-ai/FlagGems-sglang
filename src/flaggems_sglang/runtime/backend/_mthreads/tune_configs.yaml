# MP31 launch profiles. Routing block size remains owned by the caller.
fused_moe_bf16_gemm:
  m4_up:
    match:
      tokens: 4
      b_shape:
      - 256
      - 512
      - 2048
      fuse_swiglu: false
      mul_routed_weight: false
      top_k: 8
    baseline:
      BLOCK_SIZE_M: 16
      BLOCK_SIZE_N: 32
      BLOCK_SIZE_K: 64
      GROUP_SIZE_M: 1
    launch:
      BLOCK_SIZE_N: 64
  swiglu_up:
    match:
      min_tokens: 2048
      b_shape:
      - 256
      - 512
      - 2048
      fuse_swiglu: true
      mul_routed_weight: false
      top_k: 8
    launch:
      BLOCK_SIZE_K: 32
  swiglu_down:
  - match:
      tokens: 8192
      b_shape:
      - 256
      - 2048
      - 256
      fuse_swiglu: false
      mul_routed_weight: true
      top_k: 1
    baseline:
      BLOCK_SIZE_M: 32
      BLOCK_SIZE_N: 128
      BLOCK_SIZE_K: 64
      GROUP_SIZE_M: 4
      num_warps: 8
      num_stages: 1
    launch:
      num_warps: 16
  - match:
      tokens: 16384
      b_shape:
      - 256
      - 2048
      - 256
      fuse_swiglu: false
      mul_routed_weight: true
      top_k: 1
    baseline:
      BLOCK_SIZE_M: 64
      BLOCK_SIZE_N: 128
      BLOCK_SIZE_K: 64
      GROUP_SIZE_M: 4
      num_warps: 8
      num_stages: 1
    launch:
      num_warps: 16
deterministic_moe_combine:
  m2048:
    launch:
      BLOCK_M: 2
      BLOCK_DIM: 512
      num_warps: 8
      num_stages: 1
  large_prefill:
    launch:
      BLOCK_M: 1
      BLOCK_DIM: 2048
      num_warps: 16
      num_stages: 1
fused_shared_expert_gate_tail:
  m4_h2048:
    launch:
      BLOCK_H: 256
